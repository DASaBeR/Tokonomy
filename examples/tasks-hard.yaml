# Harder taskset: 8 tasks on the shop-demo fixture, designed to span difficulty so a cheap model plausibly stumbles.
# Success is judged ONLY by the hidden tests in acceptance/<task>/, copied over the result after the run.
# Prompts state the public API precisely (as a real ticket would); the traps are in the edge cases.
#
#   python examples/verify_tasks.py                       # proves each task fails on the base and passes with the reference
#   tokonomy bench examples/tasks-hard.yaml --strategies 2 --repeat 1 --max-usd 0.60 --dry-run
#
# Keep reference solutions (examples/reference/) out of the fixture: workers only ever see shop-demo.

config: .tokonomy

tasks:
  - id: sale-rounding
    repo: shop-demo
    prompt: |
      Sale prices are rounded per unit, which makes multi-quantity lines wrong by a cent. In shop/cart.py a line on
      sale must be computed as round2(unit_price * (100 - SALE_PERCENT) / 100 * qty): rounded once on the line total,
      not per unit. Example: unit price 0.99, qty 3, on sale (20% off) is 2.38, not 2.37. Lines not on sale are plain
      round2(unit_price * qty). Keep shop.pricing.sale_price(unit_price) unchanged for single units. Add unit tests.
    acceptance:
      files: acceptance/sale-rounding
      cmd: ["python", "-m", "unittest", "discover", "-s", "tests", "-t", "."]
      timeout_seconds: 120

  - id: coupon-stacking
    repo: shop-demo
    prompt: |
      Let Cart.total accept several coupons: total(coupons=None) where coupons is None, a single coupon dict (as
      today) or a list of coupon dicts. Rules: (1) an empty cart totals 0.0 whatever the coupons; (2) at most one
      percent coupon applies, the one with the highest value, other percent coupons are ignored; (3) the percent
      coupon applies first and then every fixed coupon is subtracted in the order given, regardless of the order of the
      list; (4) the result is never below 0.0; (5) a coupon with an unknown type raises ValueError (same message as
      shop.pricing.apply_coupon); (6) do not modify the list you are given. Example: subtotal 100 with
      [fixed 5, percent 10] is 85.0. Add unit tests.
    acceptance:
      files: acceptance/coupon-stacking
      cmd: ["python", "-m", "unittest", "discover", "-s", "tests", "-t", "."]
      timeout_seconds: 120

  - id: integer-cents
    repo: shop-demo
    prompt: |
      Move the cart to exact integer-cents arithmetic without changing its public float API. In shop/money.py add
      to_cents(amount: float) -> int (dollars to cents, rounding half up, so to_cents(19.99) == 1999 and
      to_cents(0.1 + 0.2) == 30) and from_cents(cents: int) -> float (cents / 100). In shop/cart.py items must store
      the price as "unit_price_cents" (an int) instead of "unit_price"; Cart.add(sku, unit_price, qty=1) still takes
      dollars. Add Cart.subtotal_cents() -> int computed with integer arithmetic only. A line costs
      unit_price_cents * qty cents; on sale it is (unit_price_cents * qty * (100 - SALE_PERCENT) + 50) // 100, i.e. the
      sale discount is applied to the whole line and rounded half up once. Cart.subtotal() returns
      from_cents(subtotal_cents()), Cart.line_total(item) returns the line in dollars as before, and Cart.total(coupon)
      keeps working. Add unit tests.
    acceptance:
      files: acceptance/integer-cents
      cmd: ["python", "-m", "unittest", "discover", "-s", "tests", "-t", "."]
      timeout_seconds: 120

  - id: csv-export
    repo: shop-demo
    prompt: |
      Add shop/report.py with two functions. orders_to_csv(orders: list[dict]) -> str, where each order is
      {"id": str, "customer": str | None, "total": float}, returns RFC 4180 CSV text: a header row "id,customer,total",
      one row per order, every line (including the last) terminated by CRLF ("\r\n"). A field that contains a comma,
      a double quote, CR or LF is wrapped in double quotes and embedded quotes are doubled (this applies to id and
      customer). None becomes an empty field. total is written with exactly two decimals and no currency symbol.
      Non-ASCII text is kept as is. write_csv(orders, path: str) -> int writes that text to a file as UTF-8 with the
      line endings exactly as produced (no newline translation by the platform) and returns the number of orders.
      Add unit tests.
    acceptance:
      files: acceptance/csv-export
      cmd: ["python", "-m", "unittest", "discover", "-s", "tests", "-t", "."]
      timeout_seconds: 120

  - id: delivery-date
    repo: shop-demo
    prompt: |
      Add shop/shipping.py with delivery_date(placed: datetime, business_days: int, holidays=frozenset()) -> date.
      A business day is Monday to Friday and not in holidays (a set of date objects). The order cutoff is 14:00: an
      order placed on a business day at or after 14:00 counts as placed on the next business day. An order placed on
      a non-business day (weekend or holiday) counts as placed at the start of the next business day, so the cutoff
      does not apply to it. The delivery date is the (effective) placement day plus business_days business days;
      business_days=0 means the effective placement day itself. A negative business_days raises ValueError. Examples
      (2026-11-02 is a Monday): placed Mon 10:00 with 3 days is Thu 2026-11-05; placed Mon 14:00 with 1 day is Wed
      2026-11-04; placed Sat with 0 days is Mon. Add unit tests.
    acceptance:
      files: acceptance/delivery-date
      cmd: ["python", "-m", "unittest", "discover", "-s", "tests", "-t", "."]
      timeout_seconds: 120

  - id: duration-parser
    repo: shop-demo
    prompt: |
      Add shop/durations.py with parse_duration(text: str) -> int returning a number of seconds. The grammar is one
      or more "<integer><unit>" parts written without spaces between them, with units d (86400 s), h (3600 s), m
      (60 s) and s (1 s). Integers are ASCII digits 0-9 only (no sign, no decimals, no other scripts). Units must be
      lowercase, appear in strictly descending order (d, h, m, s) and at most once each; at least one part is
      required. Leading and trailing whitespace around the whole string is ignored, but whitespace inside is an
      error. Examples: "1h30m" is 5400, "2d" is 172800, "90s" is 90, "0s" is 0. Anything else (empty text, "5" with no
      unit, "30m1h", "1h1h", "1.5h", "1H", "1 h") raises ValueError; a non-string raises TypeError or ValueError. Add
      unit tests.
    acceptance:
      files: acceptance/duration-parser
      cmd: ["python", "-m", "unittest", "discover", "-s", "tests", "-t", "."]
      timeout_seconds: 120

  - id: order-migration
    repo: shop-demo
    prompt: |
      Make shop.storage.load_order(text) return orders in format version 2 and migrate version 1. The result is
      {"version": 2, "id": str, "items": [{"sku": str, "unit_price_cents": int, "qty": int}], "coupons": [...]}.
      Version 1 input has no "version" key or "version": 1, items like {"sku": "a", "price": 19.99, "qty": 2} (qty
      defaults to 1) and optional "coupon_percent" and "coupon_fixed" numbers. Migration: price becomes
      unit_price_cents, the price in cents rounded half up with no float drift (19.99 is 1999, 0.1 + 0.2 is 30, 4.35 is
      435); a non-zero coupon_percent becomes {"type": "percent", "value": n} and a non-zero coupon_fixed becomes
      {"type": "fixed", "value": n}, percent first; zero or missing coupons produce nothing. Version 2 input
      ({"version": 2, "id", "items": [{"sku", "unit_price_cents", "qty"}], "coupons": [...]}) is returned equal to
      itself (qty defaults to 1, coupons default to []) and the parsed input is never mutated. Any other version value
      raises ValueError("unsupported order version: ..."). Invalid input raises ValueError: bad JSON, missing id or
      items, items not a list, an item without sku or without its price field, or a quantity that is not an integer
      of at least 1. Add unit tests.
    acceptance:
      files: acceptance/order-migration
      cmd: ["python", "-m", "unittest", "discover", "-s", "tests", "-t", "."]
      timeout_seconds: 120

  - id: ttl-cache
    repo: shop-demo
    prompt: |
      Add shop/cache.py with class TtlCache(ttl_seconds: float, max_size: int | None = None, clock=time.monotonic).
      Methods: set(key, value), get(key, default=None), delete(key) -> bool, "key in cache" and len(cache). An entry
      expires once clock() - stored_at >= ttl_seconds, so it is already gone exactly at the ttl. set() on an existing
      key replaces the value and restarts its ttl; get() does not extend the ttl. len() and "in" count only live
      entries. When max_size is set and a new key is inserted into a full cache, expired entries are dropped first and
      only if it is still full is the least recently used live entry evicted; both get() hits and set() count as use.
      Updating an existing key never evicts anything. A stored value of None is a real value. delete() returns True
      only if a live entry was removed. The cache must be safe to use from many threads, and instances must not share
      any state (no module-level mutable state). Add unit tests.
    acceptance:
      files: acceptance/ttl-cache
      cmd: ["python", "-m", "unittest", "discover", "-s", "tests", "-t", "."]
      timeout_seconds: 120
