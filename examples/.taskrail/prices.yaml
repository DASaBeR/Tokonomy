# AvalAI prices in USD per million tokens, copied from each model's details page (standard rates).
# Check them before a real benchmark: providers change prices and run promotions.
#
# above_input_tokens + above: when a request's total input exceeds the threshold, the whole request is billed at
# the `above` rates. cache_write is the price of writing tokens to the prompt cache (defaults to input).

models:
  claude-sonnet-5-5:
    input: 2
    cached_input: 0.2
    cache_write: 4
    output: 10

  # Strong model for the benchmark: same price as claude-sonnet-5-5 but 50 requests/min at tier 1 (sonnet: 2).
  gpt-6.1-sol:
    input: 2
    cached_input: 0.1
    cache_write: 2.5
    output: 10
    above_input_tokens: 272000
    above:
      input: 4
      cached_input: 0.2
      cache_write: 5
      output: 15

  # A weaker, cheaper worker for probing where the cheap tier starts to fail.
  gpt-5-nano:
    input: 0.05
    cached_input: 0.005
    output: 0.4

  claude-haiku-5-5:
    input: 0.1
    cached_input: 0.01
    cache_write: 0.2
    output: 0.5
    above_input_tokens: 100000
    above:
      input: 0.5
      cached_input: 0.05
      cache_write: 1
      output: 2.5

  deepseek-v4.1-flash:
    input: 0.15
    cached_input: 0.003
    output: 0.6
